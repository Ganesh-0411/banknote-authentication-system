<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Banknote Authentication System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex align-items-center justify-content-center py-5">

<div class="container" style="max-width: 440px;">
    <div class="text-center mb-4">
        <a th:href="@{/}" class="text-decoration-none">
            <h3 class="fw-bold text-dark d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-shield-check text-primary fs-2"></i> BanknoteGuard
            </h3>
        </a>
        <p class="text-muted small">Sign in to access Banknote Screening & Audit History</p>
    </div>

    <div class="app-card p-4 p-md-5">
        <!-- Error Alert -->
        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>
        <!-- Success Alert -->
        <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>
        <div th:if="${param.registered}" class="alert alert-success py-2 small">
            Registration successful! Please sign in below.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control" placeholder="name@banknote.com" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>

        <!-- Demo Credentials Helper -->
        <div class="p-3 bg-light rounded-3 small border mb-3">
            <div class="fw-bold mb-1"><i class="bi bi-key-fill text-warning me-1"></i> Default Demo Credentials:</div>
            <div><strong>Admin:</strong> admin@banknote.com / Admin@123</div>
            <div><strong>User:</strong> user@banknote.com / User@123</div>
        </div>

        <div class="text-center small text-muted">
            Don't have an account? <a th:href="@{/register}" class="fw-semibold text-primary">Register here</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
