<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | BanknoteGuard DL4J</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">
            <i class="bi bi-shield-check text-primary"></i>
            <span>Banknote<span class="text-primary">Guard</span></span>
        </a>
        <div class="ms-auto">
            <a class="nav-link text-white" th:href="@{/dashboard}"><i class="bi bi-arrow-left me-1"></i> Dashboard</a>
        </div>
    </div>
</nav>

<div class="container py-4" style="max-width: 600px;">
    <div class="text-center mb-4">
        <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-2">
            <i class="bi bi-person-circle fs-1"></i>
        </div>
        <h3 class="fw-bold mb-1">User Profile</h3>
        <p class="text-muted">Manage your account details and credentials</p>
    </div>

    <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

    <div class="app-card p-4 p-md-5">
        <form th:action="@{/profile}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Email Address (Read-only)</label>
                <input type="email" class="form-control" th:value="${user != null ? user.email : ''}" readonly disabled>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold">Full Name</label>
                <input type="text" name="fullName" class="form-control" th:value="${user != null ? user.fullName : ''}" required>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold">System Role</label>
                <input type="text" class="form-control" th:value="${user != null ? user.role : 'ROLE_USER'}" readonly disabled>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold">New Password (leave empty to keep current)</label>
                <input type="password" name="newPassword" class="form-control" placeholder="Enter new password">
            </div>

            <button type="submit" class="btn btn-primary-custom w-100">
                <i class="bi bi-check2-circle me-1"></i> Update Profile
            </button>
        </form>
    </div>
</div>

<footer class="text-center">
    <div class="container">
        <p class="mb-0">&copy; 2026 BanknoteGuard DL4J System.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
