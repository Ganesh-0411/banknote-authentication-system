# ===================================================================
# Application Configuration: Banknote Authentication System
# ===================================================================
spring.application.name=banknote-authentication
server.port=8080

# -------------------------------------------------------------------
# Database Configuration (Out-of-the-box Zero-Setup In-Memory Mode)
# Runs immediately without requiring an external MySQL server running!
# To use MySQL 8, run with: --spring.profiles.active=mysql
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:banknote_authentication;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------------
# File Upload Limits
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.enabled=true

# -------------------------------------------------------------------
# Banknote Autoencoder & Image Preprocessing Settings
# -------------------------------------------------------------------
banknote.model.path=models/banknote-autoencoder.zip
banknote.model.threshold-path=models/threshold.json
banknote.model.default-threshold=0.01850
banknote.model.image-width=224
banknote.model.image-height=224
banknote.model.channels=3
banknote.model.blur-variance-threshold=100.0
banknote.upload.dir=uploads/
banknote.reconstructed.dir=uploads/reconstructed/
banknote.heatmap.dir=uploads/heatmaps/

# -------------------------------------------------------------------
# Static Resources & Thymeleaf
# -------------------------------------------------------------------
spring.thymeleaf.cache=false

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.banknote.authentication=INFO
logging.level.org.deeplearning4j=INFO
logging.level.org.nd4j=WARN
